[package]
name = "hermes-fleet"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Control plane for fleet-managed Hermes agents (one Docker Compose project per instance)"
publish = false

[features]
default = []
# Embed the built frontend (../web/dist) into the binary. Off by default: it
# requires the folder to exist at compile time.
embed-web = ["dep:rust-embed"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
