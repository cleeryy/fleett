name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset_target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            asset_target: linux-x86_64
            cross: true
          - runner: ubuntu-24.04
            rust_target: aarch64-unknown-linux-musl
            asset_target: linux-aarch64
            cross: true
          - runner: macos-14
            rust_target: aarch64-apple-darwin
            asset_target: darwin-aarch64
            cross: false
          - runner: macos-14
            rust_target: x86_64-apple-darwin
            asset_target: darwin-x86_64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.cross }}
        with:
          targets: ${{ matrix.rust_target }}

      - uses: taiki-e/install-action@cross
        if: ${{ matrix.cross }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.asset_target }}

      - name: Build binary
        working-directory: backend
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --features embed-web --target "${{ matrix.rust_target }}"
          else
            cargo build --release --locked --features embed-web --target "${{ matrix.rust_target }}"
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="hermes-fleet_${version}_${{ matrix.asset_target }}"
          mkdir -p dist
          cp "backend/target/${{ matrix.rust_target }}/release/hermes-fleet" dist/hermes-fleet
          chmod 0755 dist/hermes-fleet
          tar -C dist -czf "dist/${name}.tar.gz" hermes-fleet
          rm dist/hermes-fleet
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
