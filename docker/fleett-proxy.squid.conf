# fleett egress proxy — Squid allowlist configuration.
#
# Mounted at /etc/squid/squid.conf by fleett-proxy.example.yaml. Replace the
# two ACL files with the lists generated from GET /api/egress/summary (see
# docs/EGRESS.md). This file is an allowlist: only the listed FQDNs/CIDRs on
# the listed ports pass, everything else is denied and logged.

http_port 3128
visible_hostname fleett-egress-proxy

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

acl fleett_domains dstdomain "/etc/squid/fleett-domains.txt"
acl fleett_nets dst "/etc/squid/fleett-cidrs.txt"
acl fleett_ports port 80 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow fleett_domains fleett_ports
http_access allow fleett_nets fleett_ports
http_access deny all

# Refusals are what a log shipper should POST to /api/egress/blocks.
access_log stdio:/var/log/squid/access.log
cache deny all
